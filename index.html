<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link id="app-favicon" rel="icon" type="image/svg+xml" href="/favicon-dark.svg" />
    <link id="app-touch-icon" rel="apple-touch-icon" href="/app-icon-dark.png" />
    <meta id="app-theme-color" name="theme-color" content="#0D3D2E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap"
      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="FITNES — AI-тренер: рацион и тренировки под твою цель."
    />
    <title>FITNES — AI fitness coach</title>
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('fitnes-theme')
          var theme =
            stored === 'light' || stored === 'dark' ? stored : 'dark'
          document.documentElement.setAttribute('data-theme', theme)
          document.documentElement.style.colorScheme = theme

          var favicon = document.getElementById('app-favicon')
          var touch = document.getElementById('app-touch-icon')
          var themeColor = document.getElementById('app-theme-color')
          if (favicon) {
            favicon.setAttribute(
              'href',
              theme === 'light' ? '/favicon-light.svg' : '/favicon-dark.svg',
            )
          }
          if (touch) {
            touch.setAttribute(
              'href',
              theme === 'light' ? '/app-icon-light.png' : '/app-icon-dark.png',
            )
          }
          if (themeColor) {
            themeColor.setAttribute(
              'content',
              theme === 'light' ? '#2EE6A6' : '#0D3D2E',
            )
          }

          var locale = localStorage.getItem('fitnes-locale')
          document.documentElement.lang =
            locale === 'en' || locale === 'ru' ? locale : 'ru'
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark')
          document.documentElement.lang = 'ru'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
